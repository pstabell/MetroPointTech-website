<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Agenient">
  <defs>
    <radialGradient id="bgFill" cx="32%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#1f3454"/>
      <stop offset="60%" stop-color="#0f1d35"/>
      <stop offset="100%" stop-color="#070d1c"/>
    </radialGradient>
    <linearGradient id="goldFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4dc8a"/>
      <stop offset="55%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a47e1f"/>
    </linearGradient>
    <linearGradient id="goldDim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8a64e"/>
      <stop offset="100%" stop-color="#8a6c1d"/>
    </linearGradient>
  </defs>

  <circle cx="120" cy="120" r="118" fill="url(#bgFill)"/>

  <!-- Sunburst frame: 24 small gold triangles around the perimeter -->
  <g fill="url(#goldFill)" stroke="none">
    <polygon points="120.00,3.00 115.50,18.00 124.50,18.00"/>
    <polygon points="150.28,6.99 142.05,20.31 150.75,22.64"/>
    <polygon points="178.50,18.68 167.10,29.42 174.90,33.92"/>
    <polygon points="202.73,37.27 188.94,44.69 195.31,51.06"/>
    <polygon points="221.32,61.50 206.08,65.10 210.58,72.90"/>
    <polygon points="233.01,89.72 217.36,89.25 219.69,97.95"/>
    <polygon points="237.00,120.00 222.00,115.50 222.00,124.50"/>
    <polygon points="233.01,150.28 219.69,142.05 217.36,150.75"/>
    <polygon points="221.32,178.50 210.58,167.10 206.08,174.90"/>
    <polygon points="202.73,202.73 195.31,188.94 188.94,195.31"/>
    <polygon points="178.50,221.32 174.90,206.08 167.10,210.58"/>
    <polygon points="150.28,233.01 150.75,217.36 142.05,219.69"/>
    <polygon points="120.00,237.00 124.50,222.00 115.50,222.00"/>
    <polygon points="89.72,233.01 97.95,219.69 89.25,217.36"/>
    <polygon points="61.50,221.32 72.90,210.58 65.10,206.08"/>
    <polygon points="37.27,202.73 51.06,195.31 44.69,188.94"/>
    <polygon points="18.68,178.50 33.92,174.90 29.42,167.10"/>
    <polygon points="6.99,150.28 22.64,150.75 20.31,142.05"/>
    <polygon points="3.00,120.00 18.00,124.50 18.00,115.50"/>
    <polygon points="6.99,89.72 20.31,97.95 22.64,89.25"/>
    <polygon points="18.68,61.50 29.42,72.90 33.92,65.10"/>
    <polygon points="37.27,37.27 44.69,51.06 51.06,44.69"/>
    <polygon points="61.50,18.68 65.10,33.92 72.90,29.42"/>
    <polygon points="89.72,6.99 89.25,22.64 97.95,20.31"/>
  </g>

  <!--
    8-point compass star — all triangles, no center square.
    4 long cardinal triangles (N, E, S, W) in bright gold.
    4 shorter diagonal triangles (NE, SE, SW, NW) in dimmer gold for depth.
    All 8 triangle bases converge near the exact center as a single point.
  -->
  <!-- Diagonal (ordinal) triangles in dimmer gold, drawn first so they sit behind cardinals -->
  <g fill="url(#goldDim)" stroke="none">
    <polygon points="163.84,76.16 124.24,124.24 115.76,115.76"/>
    <polygon points="163.84,163.84 115.76,124.24 124.24,115.76"/>
    <polygon points="76.16,163.84 115.76,115.76 124.24,124.24"/>
    <polygon points="76.16,76.16 124.24,115.76 115.76,124.24"/>
  </g>
  <!-- Cardinal triangles in bright gold, on top -->
  <g fill="url(#goldFill)" stroke="none">
    <polygon points="120.00,30.00 126.00,120.00 114.00,120.00"/>
    <polygon points="210.00,120.00 120.00,126.00 120.00,114.00"/>
    <polygon points="120.00,210.00 114.00,120.00 126.00,120.00"/>
    <polygon points="30.00,120.00 120.00,114.00 120.00,126.00"/>
  </g>
</svg>
